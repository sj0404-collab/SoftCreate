name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: APK size
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          python3 - <<'PY'
          import os, pathlib
          apk = next(pathlib.Path("app/build/outputs/apk/debug").glob("*.apk"))
          mb = apk.stat().st_size / (1024*1024)
          print(f"APK {apk.name} = {mb:.1f} MB")
          if mb < 50:
              raise SystemExit(f"APK too small: {mb:.1f} MB")
          if mb > 120:
              raise SystemExit(f"APK unexpectedly huge: {mb:.1f} MB")
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileForge-2.2.0-debug
          path: app/build/outputs/apk/debug/*.apk
