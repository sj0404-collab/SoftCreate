name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Shared signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mobileforge.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mobileforge.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing=shared"
          else
            echo "signing=debug-default (no shared key secret)"
          fi
      - name: Assemble APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Name and check APKs
        run: |
          mkdir -p dist
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$DEBUG_APK" dist/MobileForge-2.10.1-debug.apk
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            REL_APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
            cp "$REL_APK" dist/MobileForge-2.10.1-release.apk
          fi
          ls -lh dist
          python3 - <<'PY'
          import pathlib, sys
          files = list(pathlib.Path("dist").glob("*.apk"))
          if not files:
              sys.exit("no apk")
          for apk in files:
              mb = apk.stat().st_size / (1024*1024)
              print(f"APK {apk.name} = {mb:.1f} MB")
              if mb < 50:
                  sys.exit(f"APK too small: {mb:.1f} MB")
              if mb > 120:
                  sys.exit(f"APK unexpectedly huge: {mb:.1f} MB")
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileForge-2.10.1
          path: dist/*.apk
      - name: GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.1
          name: MobileForge 2.10.1
          fail_on_unmatched_files: false
          files: dist/*.apk
          body: |
            Чат и проект пишутся на диск (не сбрасываются после вылета).
            Play обёрнут, wav/материалы цепляются к сцене, плагины с JS.
            Сначала «делаю», тулы свёрнуты, размышление снова видно.
